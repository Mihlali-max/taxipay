version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: fareflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fareflow
      POSTGRES_USER: fareflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fareflow_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fareflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fareflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runtime
    container_name: fareflow_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fareflow:${DB_PASSWORD:-fareflow_dev}@db:5432/fareflow
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - fareflow_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./static:/app/static:ro

  nginx:
    image: nginx:alpine
    container_name: fareflow_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/snippets/security_headers.conf:ro
      - ./static:/app/static:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - fareflow_net

  certbot:
    image: certbot/certbot
    container_name: fareflow_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_www:
  certbot_conf:

networks:
  fareflow_net:
    driver: bridge
