# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=payment:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Block bad bots and scanners
map $http_user_agent $bad_bot {
    default 0;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*zgrab 1;
    ~*scrapy 1;
    ~*dirbuster 1;
    ~*gobuster 1;
    ~*nuclei 1;
    ~*acunetix 1;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    # For dev/staging - serve directly
    include /etc/nginx/snippets/security_headers.conf;

    client_max_body_size 10M;
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Block bad bots
    if ($bad_bot) {
        return 444;
    }

    # Block common attack paths
    location ~* (\.php|\.asp|\.aspx|\.jsp|\.cgi|wp-admin|wp-login|phpmyadmin) {
        return 444;
    }

    # Block SQL injection patterns in URLs
    location ~* (union|select|insert|drop|delete|update|cast|exec|declare|char|nchar|varchar|alter) {
        return 444;
    }

    # Static files
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
    }

    # WebSocket
    location /ws/ {
        limit_conn conn_limit 5;
        proxy_pass http://app:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Payment endpoints - strict rate limiting
    location ~* ^/payments/ {
        limit_req zone=payment burst=5 nodelay;
        limit_conn conn_limit 3;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints - very strict rate limiting
    location ~* ^/(admin|driver)/login {
        limit_req zone=login burst=3 nodelay;
        limit_conn conn_limit 2;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
